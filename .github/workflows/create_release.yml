name: Create New Release

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:
  repository_dispatch:
    types: [circleci-failed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-circleci:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Evaluate fallback necessity
        id: check
        env:
          CIRCLE_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "Instant fallback triggered by CircleCI failure notification."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ -z "$CIRCLE_TOKEN" ]]; then
            echo "CIRCLECI_TOKEN secret not found. Running fallback build."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          api_test=$(curl -s -o /dev/null -w "%{http_code}" -H "Circle-Token: $CIRCLE_TOKEN" \
            "https://circleci.com/api/v2/me" || true)
          
          if [[ "$api_test" != "200" ]]; then
            echo "CircleCI API unreachable (HTTP $api_test). Running fallback build."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          pipeline_found="false"
          pipeline_id=""
          for i in {1..6}; do
            response=$(curl -s -H "Circle-Token: $CIRCLE_TOKEN" \
              "https://circleci.com/api/v2/project/gh/${{ github.repository }}/pipeline")
            
            if ! echo "$response" | jq -e . >/dev/null 2>&1; then
              echo "Invalid API response. Running fallback."
              echo "should_run=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            pipeline_id=$(echo "$response" | jq -r --arg SHA "${{ github.sha }}" '.items[] | select(.vcs.revision==$SHA) | .id' | head -n 1)
            
            if [[ -n "$pipeline_id" && "$pipeline_id" != "null" ]]; then
              pipeline_found="true"
              echo "Found CircleCI pipeline: $pipeline_id"
              break
            fi
            
            echo "No pipeline found for commit ${{ github.sha }}. Retry $i/6 in 30s..."
            sleep 30
          done
          
          if [[ "$pipeline_found" == "false" ]]; then
            echo "No CircleCI pipeline found after 3 minutes. Likely out of credits. Running fallback."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          for i in {1..30}; do
            wf_response=$(curl -s -H "Circle-Token: $CIRCLE_TOKEN" \
              "https://circleci.com/api/v2/pipeline/$pipeline_id/workflow")
            
            if ! echo "$wf_response" | jq -e . >/dev/null 2>&1; then
              echo "Invalid workflow response. Running fallback."
              echo "should_run=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            status=$(echo "$wf_response" | jq -r '.items[0].status')
            echo "CircleCI workflow status: $status (poll $i/30)"
            
            if [[ "$status" == "success" ]]; then
              echo "CircleCI build succeeded. Skipping GitHub Actions fallback."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            elif [[ "$status" == "running" ]] || [[ "$status" == "on_hold" ]] || [[ "$status" == "not_run" ]]; then
              sleep 30
              continue
            else
              echo "CircleCI workflow failed/cancelled (status: $status). Running fallback."
              echo "should_run=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          
          echo "Timeout waiting for CircleCI. Running fallback."
          echo "should_run=true" >> $GITHUB_OUTPUT

  build-and-release:
    runs-on: ubuntu-latest
    needs: check-circleci
    if: needs.check-circleci.outputs.should_run == 'true'
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: read
      issues: read
    env:
      CCACHE_DIR: "/home/runner/.cache/ccache"
      CCACHE_MAXSIZE: "2G"
      CARGO_BUILD_JOBS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Setup Swap Space (OOM fix)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          free -h

      - name: Install Rust and Cargo-NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xvzf - -C ~/.cargo/bin
          cargo binstall -y cargo-ndk

      - name: Ensure OpenSSL vendored build tools
        run: |
          perl --version | head -1
          make --version | head -1
          sudo apt-get install -y nasm 2>/dev/null || true

      - name: Get mpv-android upstream commit hash
        id: mpv_hash
        run: |
          HASH=$(git ls-remote https://github.com/mpv-android/mpv-android.git HEAD 2>/dev/null | awk '{print $1}')
          if [ -z "$HASH" ]; then HASH="unknown"; fi
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "mpv-android HEAD: $HASH"

      - name: Cache MPV Android source
        uses: actions/cache@v4
        with:
          path: mpv-android
          key: ${{ runner.os }}-mpv-src-v1-${{ steps.mpv_hash.outputs.hash }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v1-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            app/src/main/rust/target
          key: ${{ runner.os }}-rust-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-v1-

      - name: Install latest Meson, Ninja, and ccache
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ccache yasm nasm pkg-config python3-pip python3-setuptools
          python3 -m pip install --upgrade pip
          pip3 install meson ninja

      - name: Build mpv-android (Universal Support)
        run: |
          if command -v ccache &> /dev/null; then
              export PATH="/usr/lib/ccache:$PATH"
              ccache -s
          fi

          if [ ! -d "mpv-android" ]; then
            git clone https://github.com/mpv-android/mpv-android.git
          fi
          
          cd mpv-android/buildscripts
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          chmod +x *.sh

          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
          git config --global url."https://".insteadOf git://

          echo "Checking/Downloading sources..."
          ./download.sh

          for arch in arm64 armv7l x86 x86_64; do
            echo "----------------------------------------"
            echo "Building mpv for: $arch"
            echo "----------------------------------------"

            ./buildall.sh --arch $arch

            if [ "$arch" = "arm64" ]; then ABI="arm64-v8a";
            elif [ "$arch" = "armv7l" ]; then ABI="armeabi-v7a";
            else ABI="$arch"; fi

            TARGET_DIR="../../app/src/main/jniLibs/$ABI"
            mkdir -p "$TARGET_DIR"

            echo "Extracting libmpv.so for $ABI..."
            find ${{ github.workspace }} -type f -name "libmpv.so" | grep "$arch" | head -n 1 | xargs -I {} cp {} "$TARGET_DIR/" || true

            echo "Extracting FFmpeg .so files for $ABI..."
            find ${{ github.workspace }} -type f -name "*.so" | grep -E "(libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale)" | grep "$arch" | while read -r libfile; do
              cp "$libfile" "$TARGET_DIR/" || true
            done
          done

          echo "Downloading mpv header files..."
          mkdir -p ${{ github.workspace }}/app/src/main/cpp/include/mpv
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/client.h    -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/client.h
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render.h    -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/render.h
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render_gl.h -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/render_gl.h
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/stream_cb.h -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/stream_cb.h

          echo "Copying FFmpeg header files..."
          FFMPEG_INCLUDE_BASE=$(find ${{ github.workspace }}/mpv-android/buildscripts/prefix \
            -maxdepth 2 -type d -name "include" | head -n 1)

          if [ -z "$FFMPEG_INCLUDE_BASE" ]; then
            echo "Normal path not found — trying recursive search..."
            FFMPEG_INCLUDE_BASE=$(find ${{ github.workspace }}/mpv-android \
              -path "*/include/libavcodec" -type d | head -n 1 | sed 's|/libavcodec||')
          fi

          if [ -n "$FFMPEG_INCLUDE_BASE" ]; then
            echo "FFmpeg include base: $FFMPEG_INCLUDE_BASE"
            for lib in libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
              if [ -d "$FFMPEG_INCLUDE_BASE/$lib" ]; then
                cp -r "$FFMPEG_INCLUDE_BASE/$lib" ${{ github.workspace }}/app/src/main/cpp/include/
                echo "  Copied $lib"
              fi
            done
          else
            echo "ERROR: FFmpeg headers not found."
            exit 1
          fi

          if command -v ccache &> /dev/null; then
              ccache -s
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          BACKEND_BASE_URL:          ${{ secrets.BACKEND_BASE_URL }}
          STARTAPP_APP_ID:           ${{ secrets.STARTAPP_APP_ID }}
          RELEASE_KEYSTORE_FILE:     ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:         ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:      ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_KEYSTORE_FILE=${{ env.RELEASE_KEYSTORE_FILE }} \
            -PRELEASE_KEYSTORE_PASSWORD=${{ env.RELEASE_KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ env.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ env.RELEASE_KEY_PASSWORD }}

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Ultra-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Generate Release Notes
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "template": "# StreamX Ultra ${{ github.ref_name }}\n\n## Change Log\n#{{changelog}}\n\n---\n\n### Download Info\n- **Version**: ${{ github.ref_name }}\n- **Status**: Stable Release\n\n*Generated by StreamX Bot* | AeonCoreX",
              "categories": [
                {"title": "## New Features",   "labels": ["feat","feature","new"]},
                {"title": "## Bug Fixes",      "labels": ["fix","bug","hotfix"]},
                {"title": "## UI/UX",          "labels": ["ui","design"]},
                {"title": "## Performance",    "labels": ["perf","refactor"]}
              ],
              "ignore_labels": ["release","ignore","ci"],
              "sort": "label"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files:    app/build/outputs/apk/release/*.apk
          name:     "StreamX Ultra ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body:     ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          