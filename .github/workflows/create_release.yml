name: Create New Release

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── cmake 4.x (vcpkg requires >= 4.3.2) ───────────────────────────
      - name: Install cmake 4.x (required by vcpkg)
        uses: lukka/get-cmake@latest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # Release: all 4 Rust targets
      - name: Install Rust and Cargo-NDK
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          cargo install cargo-ndk

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build yasm nasm pkg-config python3-pip
          pip3 install --break-system-packages meson --upgrade

      # ── vcpkg binary cache (all 4 Android triplets) ────────────────────
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v6-all-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v6-all-

      - name: Get latest vcpkg commit ID
        id: vcpkg-git
        run: |
          LATEST_ID=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | awk '{ print $1 }')
          echo "commit_id=$LATEST_ID" >> $GITHUB_OUTPUT

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: 'app/src/main/cpp/vcpkg.json'
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-git.outputs.commit_id }}
          doNotUpdateVcpkg: false

      # ── Build FFmpeg via vcpkg (all 4 Android ABI triplets) ────────────
      - name: Build FFmpeg via vcpkg (all 4 Android ABIs)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          VCPKG="${{ github.workspace }}/vcpkg/vcpkg"
          INSTALL_ROOT="${{ github.workspace }}/vcpkg_installed"

          for TRIPLET in arm64-android arm-android x64-android x86-android; do
            echo "📦 vcpkg install ffmpeg[openssl] → $TRIPLET"
            $VCPKG install "ffmpeg[openssl]" \
              --triplet "$TRIPLET" \
              --host-triplet x64-linux \
              --x-install-root="$INSTALL_ROOT" \
              --no-print-usage
            echo "  ✅ $TRIPLET done"
          done

          echo ""
          echo "📋 Installed triplets:"
          ls -1 "$INSTALL_ROOT/"

      # ── mpv artifact cache (all 4 ABIs) ────────────────────────────────
      - name: Get mpv-android HEAD commit (for cache key)
        id: mpv-version
        run: |
          COMMIT=$(git ls-remote https://github.com/mpv-android/mpv-android.git HEAD \
                   | awk '{print $1}' | head -c 12)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "mpv-android HEAD: $COMMIT"

      - name: Cache mpv + FFmpeg native artifacts (all ABIs)
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/include
          key: ${{ runner.os }}-mpv-vcpkg-all-v2-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}-${{ steps.mpv-version.outputs.commit }}
          restore-keys: |
            ${{ runner.os }}-mpv-vcpkg-all-v2-

      # ── Build mpv for all 4 ABIs (FFmpeg from vcpkg) ───────────────────
      # Same 3 fixes as android-build.yml applied to all 4 ABI loops
      - name: Build mpv (all ABIs, using vcpkg FFmpeg — skip FFmpeg source build)
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        run: |
          WS="${{ github.workspace }}"
          INSTALL_ROOT="$WS/vcpkg_installed"

          git clone --depth=1 https://github.com/mpv-android/mpv-android.git
          cd mpv-android/buildscripts

          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
          git config --global url."https://".insteadOf git://
          chmod +x *.sh

          echo "📥 Downloading mpv sources..."
          ./download.sh

          # ── Replace build-ffmpeg.sh + build-openssl.sh with no-ops ───
          # FIX: Replace instead of sed-patching buildall.sh.
          # Reliable across all mpv-android versions.
          cat > build-ffmpeg.sh << 'NOOP'
          #!/bin/bash
          echo "✅ [vcpkg] FFmpeg source build skipped — using vcpkg FFmpeg"
          exit 0
          NOOP
          chmod +x build-ffmpeg.sh

          cat > build-openssl.sh << 'NOOP'
          #!/bin/bash
          echo "✅ [vcpkg] OpenSSL source build skipped — using vcpkg OpenSSL"
          exit 0
          NOOP
          chmod +x build-openssl.sh

          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          # ABI mapping: mpv-arch → android-ABI → vcpkg-triplet
          declare -A VCPKG_TRIPLET=([arm64]=arm64-android [armv7l]=arm-android [x86_64]=x64-android [x86]=x86-android)
          declare -A ABI_NAME=(     [arm64]=arm64-v8a     [armv7l]=armeabi-v7a  [x86_64]=x86_64      [x86]=x86)
          # mpv-android uses BOTH naming conventions in different versions
          declare -A PREFIX_ALTS=([arm64]="arm64-v8a arm64" [armv7l]="armeabi-v7a arm" [x86_64]="x86_64 x86-64" [x86]="x86 x86_32")

          for MPV_ARCH in arm64 armv7l x86_64 x86; do
            TRIPLET="${VCPKG_TRIPLET[$MPV_ARCH]}"
            ABI="${ABI_NAME[$MPV_ARCH]}"
            VCPKG_DIR="$INSTALL_ROOT/$TRIPLET"

            echo ""
            echo "═══════════════════════════════════════"
            echo "🔧 Populating prefix for $MPV_ARCH (vcpkg: $TRIPLET)"
            echo "═══════════════════════════════════════"

            # FIX: copy to prefix/{arch}/usr/local/ (correct mpv-android path)
            for PREFIX_ARCH in ${PREFIX_ALTS[$MPV_ARCH]}; do
              USR_LOCAL="$WS/mpv-android/buildscripts/prefix/$PREFIX_ARCH/usr/local"
              mkdir -p "$USR_LOCAL/lib" "$USR_LOCAL/include" "$USR_LOCAL/lib/pkgconfig"

              find "$VCPKG_DIR/lib" -maxdepth 1 \
                \( -name "libav*.so" -o -name "libsw*.so" \
                   -o -name "libssl.so" -o -name "libcrypto.so" \
                   -o -name "libav*.a"  -o -name "libsw*.a"  \
                   -o -name "libssl.a"  -o -name "libcrypto.a" \) \
                -exec cp {} "$USR_LOCAL/lib/" \; 2>/dev/null || true

              for HDIR in libavcodec libavdevice libavfilter libavformat \
                          libavutil libswresample libswscale openssl; do
                [ -d "$VCPKG_DIR/include/$HDIR" ] && \
                  cp -r "$VCPKG_DIR/include/$HDIR" "$USR_LOCAL/include/"
              done

              find "$VCPKG_DIR/lib/pkgconfig" \
                \( -name "libav*.pc" -o -name "libsw*.pc" \
                   -o -name "libssl*.pc" -o -name "openssl*.pc" \) \
                -exec cp {} "$USR_LOCAL/lib/pkgconfig/" \; 2>/dev/null || true

              find "$USR_LOCAL/lib/pkgconfig" -name "*.pc" -exec \
                sed -i \
                  -e "s|^prefix=.*|prefix=$USR_LOCAL|" \
                  -e "s|^exec_prefix=.*|exec_prefix=$USR_LOCAL|" \
                {} \;

              SO_COUNT=$(find "$USR_LOCAL/lib" -name '*.so' 2>/dev/null | wc -l)
              echo "  ✅ prefix/$PREFIX_ARCH/usr/local/ ready ($SO_COUNT .so)"
            done
          done

          echo ""
          echo "🚀 Building mpv for all 4 ABIs..."
          for MPV_ARCH in arm64 armv7l x86_64 x86; do
            ABI="${ABI_NAME[$MPV_ARCH]}"
            TRIPLET="${VCPKG_TRIPLET[$MPV_ARCH]}"
            VCPKG_DIR="$INSTALL_ROOT/$TRIPLET"
            TARGET_DIR="$WS/app/src/main/jniLibs/$ABI"
            mkdir -p "$TARGET_DIR"

            echo ""
            echo "── Building $MPV_ARCH ──"
            ./buildall.sh --arch "$MPV_ARCH"

            MPV_SO=$(find "$WS/mpv-android" -name "libmpv.so" | grep -i "$MPV_ARCH\|$ABI" | head -1)
            [ -z "$MPV_SO" ] && MPV_SO=$(find "$WS/mpv-android" -name "libmpv.so" | head -1)

            if [ -n "$MPV_SO" ]; then
              cp "$MPV_SO" "$TARGET_DIR/"
              echo "  ✅ libmpv.so ($ABI)"
            else
              echo "  ❌ libmpv.so not found for $ABI"
              exit 1
            fi

            for LIB in libavcodec libavdevice libavfilter libavformat \
                       libavutil libswresample libswscale; do
              SO=$(find "$VCPKG_DIR/lib" -maxdepth 1 -name "${LIB}.so" | head -1)
              [ -n "$SO" ] && cp "$SO" "$TARGET_DIR/" && echo "  ✅ $LIB ($ABI)" || \
                echo "  ⚠️  $LIB.so not found for $ABI"
            done

            echo "  📋 jniLibs/$ABI: $(ls $TARGET_DIR | wc -l) files"
          done

          # ── Headers (from arm64 vcpkg — same for all ABIs) ────────────
          mkdir -p "$WS/app/src/main/cpp/include/mpv"
          for H in client render render_gl stream_cb; do
            curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/${H}.h" \
                 -o "$WS/app/src/main/cpp/include/mpv/${H}.h"
          done
          for HDIR in libavcodec libavdevice libavfilter libavformat \
                      libavutil libswresample libswscale; do
            [ -d "$INSTALL_ROOT/arm64-android/include/$HDIR" ] && \
              cp -r "$INSTALL_ROOT/arm64-android/include/$HDIR" \
                    "$WS/app/src/main/cpp/include/"
          done

          echo ""
          echo "📋 Final include/ contents:"
          ls "$WS/app/src/main/cpp/include/"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          BACKEND_BASE_URL:          ${{ secrets.BACKEND_BASE_URL }}
          STARTAPP_APP_ID:           ${{ secrets.STARTAPP_APP_ID }}
          RELEASE_KEYSTORE_FILE:     ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:         ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:      ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_KEYSTORE_FILE=${{ env.RELEASE_KEYSTORE_FILE }} \
            -PRELEASE_KEYSTORE_PASSWORD=${{ env.RELEASE_KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ env.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ env.RELEASE_KEY_PASSWORD }}

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Ultra-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: "StreamX Bot: Generate Release Notes"
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "template": "# 🚀 StreamX Ultra ${{ github.ref_name }}\n\n## 📋 Change Log\n#{{changelog}}\n\n---\n\n### 📦 Download Info\n- **Version**: ${{ github.ref_name }}\n- **Status**: Stable Release\n\n🤖 *Generated by StreamX Bot* | © AeonCoreX™",
              "categories": [
                  {"title": "## ✨ New Features", "labels": ["feat", "feature", "new"]},
                  {"title": "## 🐛 Bug Fixes",    "labels": ["fix", "bug", "hotfix"]},
                  {"title": "## 🎨 UI/UX",        "labels": ["ui", "design"]},
                  {"title": "## ⚡ Performance",  "labels": ["perf", "refactor"]}
              ],
              "ignore_labels": ["release", "ignore", "ci"],
              "sort": "label"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files:    app/build/outputs/apk/release/*.apk
          name:     "StreamX Ultra ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body:     ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}