name: Create New Release

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust and Cargo-NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/target
          key: ${{ runner.os }}-rust-release-${{ hashFiles('app/src/main/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-
            ${{ runner.os }}-rust-

      # ── MPV + FFmpeg ───────────────────────────────────────────────────────
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build yasm nasm python3-pip pkg-config
          pip3 install meson ninja

      - name: Build mpv-android
        run: |
          git clone --depth 1 https://github.com/mpv-android/mpv-android.git
          cd mpv-android/buildscripts
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          chmod +x *.sh

          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
          git config --global url."https://".insteadOf git://

          ./download.sh

          for arch in arm64 armv7l x86_64; do
            ./buildall.sh --arch $arch

            if   [ "$arch" = "arm64"  ]; then ABI="arm64-v8a"
            elif [ "$arch" = "armv7l" ]; then ABI="armeabi-v7a"
            else ABI="$arch"; fi

            TARGET_DIR="../../app/src/main/jniLibs/$ABI"
            mkdir -p "$TARGET_DIR"

            find ${{ github.workspace }} -name "libmpv.so" | grep "$arch" | head -1 | xargs -I{} cp {} "$TARGET_DIR/" || true
            find ${{ github.workspace }} -name "*.so" | grep -E "(libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale)" | grep "$arch" | while read f; do
              cp "$f" "$TARGET_DIR/" || true
            done
          done

          mkdir -p ${{ github.workspace }}/app/src/main/cpp/include/mpv
          for h in client render render_gl stream_cb; do
            curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/$h.h" \
              -o "${{ github.workspace }}/app/src/main/cpp/include/mpv/$h.h"
          done

          FFMPEG_INC=$(find ${{ github.workspace }}/mpv-android -path "*/include/libavcodec" -type d | head -1 | sed 's|/libavcodec||')
          if [ -n "$FFMPEG_INC" ]; then
            for lib in libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
              [ -d "$FFMPEG_INC/$lib" ] && cp -r "$FFMPEG_INC/$lib" ${{ github.workspace }}/app/src/main/cpp/include/
            done
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          TMDB_API_KEY:              ${{ secrets.TMDB_API_KEY }}
          BACKEND_BASE_URL:          ${{ secrets.BACKEND_BASE_URL }}
          STARTAPP_APP_ID:           ${{ secrets.STARTAPP_APP_ID }}
          RELEASE_KEYSTORE_FILE:     ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:         ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:      ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_KEYSTORE_FILE=${{ env.RELEASE_KEYSTORE_FILE }} \
            -PRELEASE_KEYSTORE_PASSWORD=${{ env.RELEASE_KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ env.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ env.RELEASE_KEY_PASSWORD }}

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Ultra-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Generate Release Notes
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "template": "# 🚀 StreamX Ultra ${{ github.ref_name }}\n\n## 📋 Change Log\n#{{changelog}}\n\n---\n\n### 📦 Download Info\n- **Version**: ${{ github.ref_name }}\n- **Status**: Stable Release\n\n🤖 *Generated by StreamX Bot* | © AeonCoreX™",
              "categories": [
                {"title": "## ✨ New Features",   "labels": ["feat","feature","new"]},
                {"title": "## 🐛 Bug Fixes",      "labels": ["fix","bug","hotfix"]},
                {"title": "## 🎨 UI/UX",          "labels": ["ui","design"]},
                {"title": "## ⚡ Performance",    "labels": ["perf","refactor"]}
              ],
              "ignore_labels": ["release","ignore","ci"],
              "sort": "label"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files:    app/build/outputs/apk/release/*.apk
          name:     "StreamX Ultra ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body:     ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
