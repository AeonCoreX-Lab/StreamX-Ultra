name: Debug Build & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.3.13750724'

      - name: Set NDK Env
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      # --- FIX: INSTALL RUST & CARGO-NDK ---
      - name: Install Rust and Cargo-NDK
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          cargo install cargo-ndk

      # Cache for C++ builds
      - name: Restore vcpkg artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v5-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v5-

      - name: Get latest vcpkg commit ID
        id: vcpkg-git
        run: |
          LATEST_ID=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | awk '{ print $1 }')
          echo "commit_id=$LATEST_ID" >> $GITHUB_OUTPUT
          echo "Latest vcpkg ID: $LATEST_ID"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: 'app/src/main/cpp/vcpkg.json'
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-git.outputs.commit_id }}
          doNotUpdateVcpkg: false
          
      - name: Build mpv-android (Universal Support)
        run: |
          # ১. প্রয়োজনীয় টুলস ইনস্টল
          sudo apt update && sudo apt install -y meson ninja-build yasm nasm python3-pip
          
          # ২. সোর্স ক্লোন (রিকার্সিভ ভাবে সাব-মডিউলসহ)
          git clone --recursive https://github.com/mpv-android/mpv-android.git
          cd mpv-android
          
          # ৩. NDK এবং পরিবেশ সেটআপ
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724
          
          # buildscripts ডিরেক্টরিতে গিয়ে পারমিশন ঠিক করা
          cd buildscripts
          chmod +x *.sh
          
          # ৪. সব আর্কিটেকচারের জন্য বিল্ড লুপ
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "----------------------------------------"
            echo "🚀 Building mpv for architecture: $arch"
            echo "----------------------------------------"
            
            ./buildall.sh --arch $arch
            
            # তৈরি হওয়া .so ফাইলটি তোমার অ্যাপের jniLibs-এ কপি করা
            # ডাবল ডট (../..) ব্যবহার করা হয়েছে কারণ আমরা এখন 'mpv-android/buildscripts' ফোল্ডারে আছি
            mkdir -p ../../app/src/main/jniLibs/$arch
            cp ./libmpv/build/android/$arch/libmpv.so ../../app/src/main/jniLibs/$arch/
          done
          
          # ৫. হেডার ফাইল কপি করা (যাতে native-lib.cpp থেকে এক্সেস করা যায়)
          # mpv-android/mpv/libmpv ফোল্ডারে হেডারগুলো থাকে
          mkdir -p ../../app/src/main/cpp/include/mpv
          cp ../mpv/libmpv/*.h ../../app/src/main/cpp/include/mpv/
          
          echo "✅ All architectures built and libraries copied successfully!"



      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Ultra-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
