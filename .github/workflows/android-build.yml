name: Debug Build & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.3.13750724'

      - name: Set NDK Env
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      # --- FIX: INSTALL RUST & CARGO-NDK ---
      - name: Install Rust and Cargo-NDK
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          cargo install cargo-ndk

      # Cache for C++ builds
      - name: Restore vcpkg artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v5-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v5-

      - name: Get latest vcpkg commit ID
        id: vcpkg-git
        run: |
          LATEST_ID=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | awk '{ print $1 }')
          echo "commit_id=$LATEST_ID" >> $GITHUB_OUTPUT
          echo "Latest vcpkg ID: $LATEST_ID"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: 'app/src/main/cpp/vcpkg.json'
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-git.outputs.commit_id }}
          doNotUpdateVcpkg: false
          
      - name: Build mpv-android (Universal Support)
        run: |
          sudo apt update && sudo apt install -y meson ninja-build yasm nasm python3-pip pkg-config
          git clone https://github.com/mpv-android/mpv-android.git
          cd mpv-android/buildscripts
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          chmod +x *.sh
          
          # 🚨 FIX: Force Git to use HTTPS instead of GIT protocol
          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
          git config --global url."https://".insteadOf git://
          
          echo "📥 Downloading sources..."
          ./download.sh
          
          for arch in arm64 armv7l x86 x86_64; do
            echo "----------------------------------------"
            echo "🚀 Building mpv for: $arch"
            echo "----------------------------------------"
            
            ./buildall.sh --arch $arch
            
            if [ "$arch" = "arm64" ]; then ABI="arm64-v8a";
            elif [ "$arch" = "armv7l" ]; then ABI="armeabi-v7a";
            else ABI="$arch"; fi
            
            TARGET_DIR="../../app/src/main/jniLibs/$ABI"
            mkdir -p "$TARGET_DIR"
            
            # ✅ FIX: Smart Find and Copy for libmpv.so
            echo "🔍 Extracting libmpv.so for $ABI..."
            find ../ -type f -name "libmpv.so" | grep "$arch" | head -n 1 | xargs -I {} cp {} "$TARGET_DIR/"
            
            # ✅ FIX: Smart Find and Copy for FFmpeg dependencies
            echo "📦 Extracting FFmpeg dependencies for $ABI..."
            if [ -d "deps/android-$arch/lib" ]; then
              find deps/android-$arch/lib -type f -name "*.so" -exec cp {} "$TARGET_DIR/" \;
            fi
          done
          
          # ✅ C++ Header files copy
          echo "📂 Copying header files..."
          mkdir -p ../../app/src/main/cpp/include/mpv
          if [ -d "../mpv/libmpv" ]; then
            cp ../mpv/libmpv/*.h ../../app/src/main/cpp/include/mpv/
          fi




      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Ultra-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
