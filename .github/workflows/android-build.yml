name: Debug Build & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # Guard against runaway builds (was: no limit → silent hang)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # Debug: only arm64 Rust target — no need to compile 4 targets
      - name: Install Rust (arm64 only for Debug)
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build yasm nasm pkg-config python3-pip
          pip3 install --quiet meson --upgrade

      # ── vcpkg binary cache ─────────────────────────────────────────────
      # Stores compiled FFmpeg binaries for arm64-android.
      # Key includes vcpkg.json hash → auto-invalidates if FFmpeg version changes.
      # Cache version bumped to v6 to force rebuild after removing libtorrent.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v6-arm64-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v6-arm64-

      - name: Get latest vcpkg commit ID
        id: vcpkg-git
        run: |
          LATEST_ID=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | awk '{ print $1 }')
          echo "commit_id=$LATEST_ID" >> $GITHUB_OUTPUT

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: 'app/src/main/cpp/vcpkg.json'
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-git.outputs.commit_id }}
          doNotUpdateVcpkg: false

      # ── Build FFmpeg via vcpkg for arm64-android ───────────────────────
      # First run: ~15 min (compiles FFmpeg from source)
      # Subsequent runs: ~30 sec (restored from vcpkg binary cache above)
      # vcpkg.json now has ffmpeg[openssl] instead of libtorrent/boost/openssl
      - name: Build FFmpeg via vcpkg (arm64-android)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          echo "📦 vcpkg install ffmpeg[openssl] → arm64-android"
          ${{ github.workspace }}/vcpkg/vcpkg install "ffmpeg[openssl]" \
            --triplet arm64-android \
            --host-triplet x64-linux \
            --x-install-root="${{ github.workspace }}/vcpkg_installed" \
            --no-print-usage

          echo ""
          echo "✅ vcpkg FFmpeg libs (arm64-android):"
          ls -1 "${{ github.workspace }}/vcpkg_installed/arm64-android/lib/" \
            | grep -E "libav|libsw|libssl|libcrypto" || true

      # ── mpv artifact cache ─────────────────────────────────────────────
      # Caches jniLibs/ + include/ so the 45-min mpv build is skipped on
      # subsequent runs when neither vcpkg.json nor mpv-android has changed.
      - name: Get mpv-android HEAD commit (for cache key)
        id: mpv-version
        run: |
          COMMIT=$(git ls-remote https://github.com/mpv-android/mpv-android.git HEAD \
                   | awk '{print $1}' | head -c 12)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "mpv-android HEAD: $COMMIT"

      - name: Cache mpv + FFmpeg native artifacts
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/include
          key: ${{ runner.os }}-mpv-vcpkg-arm64-v1-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}-${{ steps.mpv-version.outputs.commit }}
          restore-keys: |
            ${{ runner.os }}-mpv-vcpkg-arm64-v1-

      # ── Build mpv only (arm64), FFmpeg comes from vcpkg ───────────────
      # On cache hit this entire step is skipped → ~0 min instead of ~45 min
      # On cache miss: builds only mpv (not FFmpeg) → ~10-15 min instead of 45
      - name: Build mpv (arm64, using vcpkg FFmpeg — skip FFmpeg compile)
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        run: |
          WS="${{ github.workspace }}"
          VCPKG_ARM64="$WS/vcpkg_installed/arm64-android"

          git clone --depth=1 https://github.com/mpv-android/mpv-android.git
          cd mpv-android/buildscripts

          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
          git config --global url."https://".insteadOf git://
          chmod +x *.sh

          echo "📥 Downloading mpv sources (FFmpeg download will be skipped)..."
          ./download.sh

          echo ""
          echo "🔧 Pre-populating prefix with vcpkg FFmpeg for arm64..."
          # mpv-android may use either 'arm64' or 'arm64-v8a' as the prefix dir name.
          # We populate both so the build works regardless of the version.
          for PREFIX_ARCH in arm64-v8a arm64; do
            PREFIX_DIR="$WS/mpv-android/buildscripts/prefix/$PREFIX_ARCH"
            mkdir -p "$PREFIX_DIR/lib" "$PREFIX_DIR/include" "$PREFIX_DIR/lib/pkgconfig"

            # Shared + static libs
            find "$VCPKG_ARM64/lib" -maxdepth 1 \
              \( -name "libav*.so" -o -name "libsw*.so" \
                 -o -name "libssl.so" -o -name "libcrypto.so" \
                 -o -name "libav*.a"  -o -name "libsw*.a"  \
                 -o -name "libssl.a"  -o -name "libcrypto.a" \) \
              -exec cp {} "$PREFIX_DIR/lib/" \; 2>/dev/null || true

            # Headers
            for HDIR in libavcodec libavdevice libavfilter libavformat \
                        libavutil libswresample libswscale openssl; do
              [ -d "$VCPKG_ARM64/include/$HDIR" ] && \
                cp -r "$VCPKG_ARM64/include/$HDIR" "$PREFIX_DIR/include/"
            done

            # pkgconfig — copy then fix the prefix= path
            find "$VCPKG_ARM64/lib/pkgconfig" \
              \( -name "libav*.pc" -o -name "libsw*.pc" \
                 -o -name "libssl*.pc" -o -name "openssl*.pc" \) \
              -exec cp {} "$PREFIX_DIR/lib/pkgconfig/" \; 2>/dev/null || true

            find "$PREFIX_DIR/lib/pkgconfig" -name "*.pc" -exec \
              sed -i \
                -e "s|^prefix=.*|prefix=$PREFIX_DIR|" \
                -e "s|^exec_prefix=.*|exec_prefix=$PREFIX_DIR|" \
              {} \;

            echo "  ✅ prefix/$PREFIX_ARCH ready ($(find $PREFIX_DIR/lib -name '*.so' | wc -l) .so files)"
          done

          echo ""
          echo "🔧 Patching buildall.sh — commenting out FFmpeg & OpenSSL build steps..."
          # Handles: ./build-ffmpeg.sh, source build-ffmpeg.sh, build_ffmpeg, etc.
          sed -i -E '/[^#]*(build[-_]?(ffmpeg|openssl)|ffmpeg\.sh|openssl\.sh)/s|^|#[vcpkg-skip] |' \
            buildall.sh || true
          echo "Remaining ffmpeg/openssl lines after patch:"
          grep -iE "ffmpeg|openssl" buildall.sh | grep -v "^#" || echo "  (none — patch successful)"

          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          echo ""
          echo "🚀 Building mpv for arm64 (FFmpeg from vcpkg, not from source)..."
          ./buildall.sh --arch arm64

          # ── Copy libmpv.so ─────────────────────────────────────────
          TARGET_DIR="$WS/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_DIR"

          MPV_SO=$(find "$WS/mpv-android" -name "libmpv.so" | head -1)
          if [ -n "$MPV_SO" ]; then
            cp "$MPV_SO" "$TARGET_DIR/"
            echo "✅ libmpv.so → jniLibs/arm64-v8a/"
          else
            echo "❌ libmpv.so not found after build!"
            find "$WS/mpv-android" -name "*.so" | head -20
            exit 1
          fi

          # ── Copy vcpkg FFmpeg .so to jniLibs ──────────────────────
          echo "📦 Copying vcpkg FFmpeg libs → jniLibs/arm64-v8a/"
          for LIB in libavcodec libavdevice libavfilter libavformat \
                     libavutil libswresample libswscale; do
            SO=$(find "$VCPKG_ARM64/lib" -maxdepth 1 -name "${LIB}.so" | head -1)
            if [ -n "$SO" ]; then
              cp "$SO" "$TARGET_DIR/"
              echo "  ✅ ${LIB}.so"
            else
              echo "  ⚠️  ${LIB}.so not found in vcpkg — check vcpkg features"
            fi
          done

          echo ""
          echo "📋 jniLibs/arm64-v8a:"
          ls -lh "$TARGET_DIR/"

          # ── MPV + FFmpeg headers ───────────────────────────────────
          mkdir -p "$WS/app/src/main/cpp/include/mpv"
          for H in client render render_gl stream_cb; do
            curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/${H}.h" \
                 -o "$WS/app/src/main/cpp/include/mpv/${H}.h"
          done

          for HDIR in libavcodec libavdevice libavfilter libavformat \
                      libavutil libswresample libswscale; do
            [ -d "$VCPKG_ARM64/include/$HDIR" ] && \
              cp -r "$VCPKG_ARM64/include/$HDIR" "$WS/app/src/main/cpp/include/"
          done

          echo ""
          echo "📋 include/ contents:"
          ls "$WS/app/src/main/cpp/include/"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # assembleDebug now triggers cargoBuildDebug (arm64 only, no --release)
      # instead of cargoBuildRelease (4 ABIs, lto+codegen=1 → OOM/timeout)
      - name: Build Debug APK
        env:
          TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}
          STARTAPP_APP_ID:  ${{ secrets.STARTAPP_APP_ID }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Ultra-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
