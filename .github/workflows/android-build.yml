name: Debug Build & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

# FIX (Bug #2): Force all Node.js actions to Node.js 24 NOW
# Deadline: June 16, 2026 (forced migration). Adding this avoids the
# "Node.js 20 actions are deprecated" warning for checkout, setup-java, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          # FIX (Bug #3): Export NDK under all known names so vcpkg's android.cmake
          # toolchain can detect the compiler for ALL triplets (arm-android, arm64-android).
          # vcpkg may use ANDROID_NDK, ANDROID_NDK_ROOT, or ANDROID_NDK_HOME depending on version.
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865"      >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install Rust and Cargo-NDK
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          cargo install cargo-ndk

      - name: Install latest Meson & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools
          python3 -m pip install --upgrade pip
          pip3 install meson ninja

      # FIX (Bug #2): actions/cache@v3 used Node.js 20 → deprecated June 16, 2026
      #               Upgrade to actions/cache@v4 which uses Node.js 20+ / 24 runtime
      - name: Restore vcpkg artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v6-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v6-

      - name: Get latest vcpkg commit ID
        id: vcpkg-git
        run: |
          LATEST_ID=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | awk '{ print $1 }')
          echo "commit_id=$LATEST_ID" >> $GITHUB_OUTPUT
          echo "Latest vcpkg ID: $LATEST_ID"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: 'app/src/main/cpp/vcpkg.json'
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-git.outputs.commit_id }}
          doNotUpdateVcpkg: false

      # ── vcpkg OpenSSL for Android (needed by Gradle's CargoBuildTask) ──────
      - name: Install vcpkg OpenSSL for Android
        run: |
          export VCPKG_ROOT=${{ github.workspace }}/vcpkg
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV

          # FIX (Bug #3): vcpkg's android.cmake toolchain searches for the NDK under
          # multiple variable names. Export all three so cmake subprocess picks it up
          # regardless of vcpkg version. Without this, arm-android compiler detection
          # fails silently (|| true masks it for debug, but breaks release armeabi-v7a).
          export ANDROID_NDK=$ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME

          for triplet in arm64-android arm-android x64-android x86-android; do
            echo "Installing OpenSSL for $triplet..."
            $VCPKG_ROOT/vcpkg install openssl:$triplet || {
              echo "⚠️  openssl:$triplet failed — continuing (debug only needs arm64-android)"
            }
          done

          echo "Installed vcpkg packages:"
          ls -la $VCPKG_ROOT/installed/

      - name: Build mpv-android (Debug Fast Track)
        run: |
          sudo apt update && sudo apt install -y meson ninja-build yasm nasm python3-pip pkg-config
          git clone https://github.com/mpv-android/mpv-android.git
          cd mpv-android/buildscripts
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          chmod +x *.sh

          # ── FIX: Enable Vulkan support in libmpv.so ──────────────────
          # mpv-android's buildall.sh hardcodes apilvl=23 for the NDK cross-
          # compile target. Android's libvulkan.so only exists in the NDK
          # sysroot from API 24 onward (developer.android.com/ndk/guides/
          # graphics) — at apilvl=23, meson's dependency('vulkan') link-test
          # fails, so HAVE_VULKAN never gets defined and Vulkan support is
          # silently skipped, even on devices with real Vulkan hardware.
          #
          # StreamX Ultra's minSdkVersion is 28 (Android 9.0), well above
          # the API-24 Vulkan floor, so raising this build target is safe
          # for app compatibility — this only changes the standalone
          # meson/NDK cross-compile target used by these scripts, not
          # build.gradle.kts's minSdkVersion.
          #
          # IMPORTANT: mpv links Vulkan as a HARD dependency (-lvulkan),
          # not via dlopen. If minSdkVersion is ever lowered below 24,
          # this patch MUST be reverted first — otherwise libmpv.so would
          # fail to load entirely (UnsatisfiedLinkError: libvulkan.so not
          # found) on any device below Android 7.0, not just lose Vulkan.
          #
          # The native decode/render code itself does NOT hardcode Vulkan
          # usage — it sets gpu-context="androidvk,android" (mpv_handler.cpp)
          # so mpv safely falls back to OpenGL if Vulkan isn't available at
          # runtime, exactly as it did before this patch, on any device.
          echo "🔧 Patching buildall.sh: apilvl 23 → 24 (enables Vulkan support)"
          sed -i 's/local apilvl=23/local apilvl=24/' buildall.sh
          grep -n "apilvl=" buildall.sh

          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
          git config --global url."https://".insteadOf git://

          echo "📥 Downloading sources..."
          ./download.sh

          for arch in arm64; do
            echo "----------------------------------------"
            echo "🚀 Building mpv for: $arch"
            echo "----------------------------------------"

            ./buildall.sh --arch $arch

            if [ "$arch" = "arm64" ]; then ABI="arm64-v8a";
            elif [ "$arch" = "armv7l" ]; then ABI="armeabi-v7a";
            else ABI="$arch"; fi

            TARGET_DIR="../../app/src/main/jniLibs/$ABI"
            mkdir -p "$TARGET_DIR"

            echo "🔍 Extracting libmpv.so for $ABI..."
            find ${{ github.workspace }} -type f -name "libmpv.so" | grep "$arch" | head -n 1 | xargs -I {} cp {} "$TARGET_DIR/" || true

            echo "📦 Extracting FFmpeg .so files for $ABI..."
            find ${{ github.workspace }} -type f -name "*.so" | grep -E "(libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale)" | grep "$arch" | while read -r libfile; do
              cp "$libfile" "$TARGET_DIR/" || true
            done
          done

          # ── MPV C++ header files ───────────────────────────────────
          echo "📂 Downloading mpv header files..."
          mkdir -p ${{ github.workspace }}/app/src/main/cpp/include/mpv
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/client.h    -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/client.h
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render.h    -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/render.h
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render_gl.h -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/render_gl.h
          curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/stream_cb.h -o ${{ github.workspace }}/app/src/main/cpp/include/mpv/stream_cb.h

          # ── FFmpeg C++ header files ────────────────────────────────
          echo "📂 Copying FFmpeg header files..."
          FFMPEG_INCLUDE_BASE=$(find ${{ github.workspace }}/mpv-android/buildscripts/prefix \
            -maxdepth 2 -type d -name "include" | head -n 1)

          if [ -z "$FFMPEG_INCLUDE_BASE" ]; then
            echo "⚠️  Normal path not found — trying recursive search..."
            FFMPEG_INCLUDE_BASE=$(find ${{ github.workspace }}/mpv-android \
              -path "*/include/libavcodec" -type d | head -n 1 | sed 's|/libavcodec||')
          fi

          if [ -n "$FFMPEG_INCLUDE_BASE" ]; then
            echo "✅ FFmpeg include base: $FFMPEG_INCLUDE_BASE"
            for lib in libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
              if [ -d "$FFMPEG_INCLUDE_BASE/$lib" ]; then
                cp -r "$FFMPEG_INCLUDE_BASE/$lib" ${{ github.workspace }}/app/src/main/cpp/include/
                echo "  ✅ Copied $lib"
              fi
            done
          else
            echo "❌ ERROR: FFmpeg headers not found."
            exit 1
          fi

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Gradle build: auto-triggers CargoBuildTask → cargo ndk ─────────────
      # CargoBuildTask reads VCPKG_ROOT and sets OPENSSL_DIR automatically
      - name: Build Debug APK
        env:
          VCPKG_ROOT:           ${{ github.workspace }}/vcpkg
          STARTAPP_APP_ID:      ${{ secrets.STARTAPP_APP_ID }}
          BACKEND_BASE_URL:     ${{ secrets.BACKEND_BASE_URL }}
          METADATA_WORKER_URL:  ${{ secrets.METADATA_WORKER_URL }}
          STREAM_WORKER_URL:           ${{ secrets.STREAM_WORKER_URL }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: StreamX-Ultra-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
