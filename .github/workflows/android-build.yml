name: Debug Build & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── cmake 4.x (vcpkg requires >= 4.3.2) ───────────────────────────
      # Must run BEFORE vcpkg setup — ubuntu-latest ships cmake 3.x only.
      - name: Install cmake 4.x (required by vcpkg)
        uses: lukka/get-cmake@latest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # Debug: arm64-v8a only — no need to compile 4 targets
      - name: Install Rust (arm64 only for Debug)
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build yasm nasm pkg-config python3-pip
          pip3 install --break-system-packages meson --upgrade

      # ── vcpkg binary cache ─────────────────────────────────────────────
      # Stores compiled FFmpeg arm64-android binary.
      # Cache v6 → force rebuild after replacing libtorrent with ffmpeg.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v6-arm64-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v6-arm64-

      - name: Get latest vcpkg commit ID
        id: vcpkg-git
        run: |
          LATEST_ID=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | awk '{ print $1 }')
          echo "commit_id=$LATEST_ID" >> $GITHUB_OUTPUT

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: 'app/src/main/cpp/vcpkg.json'
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-git.outputs.commit_id }}
          doNotUpdateVcpkg: false

      # ── Build FFmpeg via vcpkg (arm64-android only for Debug) ──────────
      - name: Build FFmpeg via vcpkg (arm64-android)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          echo "📦 vcpkg install ffmpeg[openssl] → arm64-android"
          ${{ github.workspace }}/vcpkg/vcpkg install "ffmpeg[openssl]" \
            --triplet arm64-android \
            --host-triplet x64-linux \
            --x-install-root="${{ github.workspace }}/vcpkg_installed" \
            --no-print-usage

          echo ""
          echo "✅ vcpkg arm64-android libs:"
          ls -1 "${{ github.workspace }}/vcpkg_installed/arm64-android/lib/" \
            | grep -E "libav|libsw|libssl|libcrypto" || echo "(empty — check vcpkg log)"

      # ── mpv artifact cache ─────────────────────────────────────────────
      - name: Get mpv-android HEAD commit (for cache key)
        id: mpv-version
        run: |
          COMMIT=$(git ls-remote https://github.com/mpv-android/mpv-android.git HEAD \
                   | awk '{print $1}' | head -c 12)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "mpv-android HEAD: $COMMIT"

      - name: Cache mpv + FFmpeg native artifacts
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/include
          key: ${{ runner.os }}-mpv-vcpkg-arm64-v2-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}-${{ steps.mpv-version.outputs.commit }}
          restore-keys: |
            ${{ runner.os }}-mpv-vcpkg-arm64-v2-

      # ── Build mpv (arm64 only, FFmpeg from vcpkg) ──────────────────────
      # FIX 1: prefix path was wrong — mpv-android uses prefix/{arch}/usr/local/
      # FIX 2: replaced sed patch with a hard no-op script override
      # FIX 3: build-openssl.sh also replaced (mpv-android builds its own openssl)
      - name: Build mpv (arm64, using vcpkg FFmpeg — skip FFmpeg source build)
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        run: |
          WS="${{ github.workspace }}"
          VCPKG_ARM64="$WS/vcpkg_installed/arm64-android"

          git clone --depth=1 https://github.com/mpv-android/mpv-android.git
          cd mpv-android/buildscripts

          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
          git config --global url."https://".insteadOf git://
          chmod +x *.sh

          echo "📥 Downloading mpv sources..."
          ./download.sh

          # ── FIX: Replace build-ffmpeg.sh + build-openssl.sh with no-ops ──
          # Rationale: sed patch on buildall.sh is fragile (structure changes
          # with mpv-android versions). Replacing the scripts themselves is
          # reliable regardless of how buildall.sh calls them.
          #
          # We pre-populate the prefix with vcpkg FFmpeg+OpenSSL so mpv's
          # meson configure step finds them via pkg-config.

          cat > build-ffmpeg.sh << 'NOOP'
          #!/bin/bash
          # [vcpkg-skip] FFmpeg built via vcpkg — source build skipped
          echo "✅ [vcpkg] FFmpeg source build skipped — using vcpkg FFmpeg"
          exit 0
          NOOP
          chmod +x build-ffmpeg.sh

          cat > build-openssl.sh << 'NOOP'
          #!/bin/bash
          # [vcpkg-skip] OpenSSL built via vcpkg — source build skipped
          echo "✅ [vcpkg] OpenSSL source build skipped — using vcpkg OpenSSL"
          exit 0
          NOOP
          chmod +x build-openssl.sh

          echo ""
          echo "🔧 Pre-populating prefix with vcpkg FFmpeg+OpenSSL (arm64)..."
          echo "   ⚠️  Correct path: prefix/{arch}/usr/local/ (not prefix/{arch}/)"

          for PREFIX_ARCH in arm64-v8a arm64; do
            # FIXED: mpv-android installs to prefix/{arch}/usr/local/ — not prefix/{arch}/
            USR_LOCAL="$WS/mpv-android/buildscripts/prefix/$PREFIX_ARCH/usr/local"
            mkdir -p "$USR_LOCAL/lib" "$USR_LOCAL/include" "$USR_LOCAL/lib/pkgconfig"

            # Shared + static libs from vcpkg
            find "$VCPKG_ARM64/lib" -maxdepth 1 \
              \( -name "libav*.so" -o -name "libsw*.so" \
                 -o -name "libssl.so" -o -name "libcrypto.so" \
                 -o -name "libav*.a"  -o -name "libsw*.a"  \
                 -o -name "libssl.a"  -o -name "libcrypto.a" \) \
              -exec cp {} "$USR_LOCAL/lib/" \; 2>/dev/null || true

            # Headers
            for HDIR in libavcodec libavdevice libavfilter libavformat \
                        libavutil libswresample libswscale openssl; do
              [ -d "$VCPKG_ARM64/include/$HDIR" ] && \
                cp -r "$VCPKG_ARM64/include/$HDIR" "$USR_LOCAL/include/"
            done

            # pkgconfig files — copy then fix the prefix= path
            find "$VCPKG_ARM64/lib/pkgconfig" \
              \( -name "libav*.pc" -o -name "libsw*.pc" \
                 -o -name "libssl*.pc" -o -name "openssl*.pc" \) \
              -exec cp {} "$USR_LOCAL/lib/pkgconfig/" \; 2>/dev/null || true

            find "$USR_LOCAL/lib/pkgconfig" -name "*.pc" -exec \
              sed -i \
                -e "s|^prefix=.*|prefix=$USR_LOCAL|" \
                -e "s|^exec_prefix=.*|exec_prefix=$USR_LOCAL|" \
              {} \;

            SO_COUNT=$(find "$USR_LOCAL/lib" -name '*.so' 2>/dev/null | wc -l)
            echo "  ✅ prefix/$PREFIX_ARCH/usr/local/ ready ($SO_COUNT .so files)"
          done

          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          echo ""
          echo "🚀 Building mpv for arm64..."
          ./buildall.sh --arch arm64

          # ── Copy libmpv.so → jniLibs ───────────────────────────────────
          TARGET_DIR="$WS/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_DIR"

          MPV_SO=$(find "$WS/mpv-android" -name "libmpv.so" | head -1)
          if [ -n "$MPV_SO" ]; then
            cp "$MPV_SO" "$TARGET_DIR/"
            echo "✅ libmpv.so → jniLibs/arm64-v8a/"
          else
            echo "❌ libmpv.so not found!"
            find "$WS/mpv-android" -name "*.so" | head -20
            exit 1
          fi

          # ── Copy vcpkg FFmpeg .so → jniLibs ───────────────────────────
          echo "📦 Copying vcpkg FFmpeg libs → jniLibs/arm64-v8a/"
          for LIB in libavcodec libavdevice libavfilter libavformat \
                     libavutil libswresample libswscale; do
            SO=$(find "$VCPKG_ARM64/lib" -maxdepth 1 -name "${LIB}.so" | head -1)
            if [ -n "$SO" ]; then
              cp "$SO" "$TARGET_DIR/"
              echo "  ✅ ${LIB}.so"
            else
              echo "  ⚠️  ${LIB}.so not found in vcpkg"
            fi
          done

          echo ""
          echo "📋 jniLibs/arm64-v8a:"
          ls -lh "$TARGET_DIR/"

          # ── MPV + FFmpeg headers ───────────────────────────────────────
          mkdir -p "$WS/app/src/main/cpp/include/mpv"
          for H in client render render_gl stream_cb; do
            curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/${H}.h" \
                 -o "$WS/app/src/main/cpp/include/mpv/${H}.h"
          done

          for HDIR in libavcodec libavdevice libavfilter libavformat \
                      libavutil libswresample libswscale; do
            [ -d "$VCPKG_ARM64/include/$HDIR" ] && \
              cp -r "$VCPKG_ARM64/include/$HDIR" "$WS/app/src/main/cpp/include/"
          done

          echo ""
          echo "📋 include/ contents:"
          ls "$WS/app/src/main/cpp/include/"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}
          STARTAPP_APP_ID:  ${{ secrets.STARTAPP_APP_ID }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Ultra-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk