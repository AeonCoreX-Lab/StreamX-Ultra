# AndroidX এবং Jetifier (পুরানো লাইব্রেরি না থাকলে false রাখা ভালো)
android.useAndroidX=true
android.enableJetifier=false

# মেমোরি বাড়ানো হয়েছে যাতে Rust/C++ বিল্ডে সমস্যা না হয়
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# প্যারালাল বিল্ড এনাবল করা হয়েছে (বিল্ড টাইম কমাবে)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# আধুনিক অ্যান্ড্রয়েড স্ট্যান্ডার্ড
android.nonTransitiveRClass=true
kotlin.code.style=official

# বিল্ডের সময় ওয়ার্নিং কমানোর জন্য
android.suppressUntrustedRevocationCheck=true

