[package]
name        = "streamx_core"
version     = "1.4.0"
edition     = "2021"
authors     = ["AeonCoreX Team"]
publish     = false

# ── crate-type: WHY BOTH cdylib AND staticlib ─────────────────────────────────
#
# The build system uses Rust in a two-stage link:
#
#   Stage 1 — cargo ndk (Gradle CargoBuildTask)
#     cargo ndk -t arm64-v8a -o jniLibs build
#     cargo-ndk REQUIRES at least one "cdylib" target to produce output.
#     Without it → "No usable artifacts produced by cargo" (the exact error
#     that broke CI). The resulting libstreamx_core.so goes to
#     src/main/rust/jniLibs/ which is NOT declared as a jniLibs source set,
#     so it is never packaged into the APK — it just satisfies cargo-ndk.
#
#   Stage 2 — CMake (ExternalNativeBuild)
#     CMakeLists.txt imports libstreamx_core.a as STATIC IMPORTED and links
#     it into libstreamx-native.so via -Wl,--whole-archive.  That shared lib
#     is what the app loads via System.loadLibrary("streamx-native").
#     The staticlib artifact is what CargoBuildTask copies to
#     build/rust/targets/<triple>/<profile>/ for CMake to find.
#
# WRONG (old):  crate-type = ["staticlib"]   → no cdylib → cargo-ndk error
# CORRECT:      crate-type = ["cdylib", "staticlib"]   → both artifacts produced
#
[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# JNI bridge
jni            = "0.21"
log            = "0.4"
android_logger = "0.14"
anyhow         = "1.0"

# Async runtime
tokio       = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
once_cell   = "1.18"
parking_lot = "0.12"

# ── Torrent engine ─────────────────────────────────────────────────────────────
#
# FIX (Bug #2): Remove features = ["sha1-crypto-hash"] — does NOT exist in v9
#
# WHY IT FAILED (v9 regression):
#   librqbit 8.x exposed SHA-1 backend as optional features:
#     sha1-ring         → SHA-1 via ring crate
#     sha1-crypto-hash  → SHA-1 via crypto-hash/OpenSSL
#   librqbit 9.0.0-rc.0 internalized SHA-1 (always compiled in).
#   The feature was removed entirely. Cargo rejects any dep that requests
#   a feature that does not exist in the resolved crate → lock file fails.
#
# CORRECT FIX for v9:
#   Drop sha1-crypto-hash entirely (SHA-1 is now unconditional).
#   Add rust-tls → pure-Rust TLS via rustls; no OpenSSL; required on Android NDK.
#   Add disable-upload → streaming-only app; saves battery + bandwidth.
#   Everything else (piece download, DHT, tracker, magnet parsing) is always on.
#
librqbit = { version = "9.0.0-rc.0", default-features = false, features = ["rust-tls", "disable-upload"] }

# ── Local HTTP server ──────────────────────────────────────────────────────────
hyper          = { version = "1", features = ["server", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes          = "1"
tokio-util     = { version = "0.7", features = ["io"] }

# ── HTTP client (addon transport) ──────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Utilities ──────────────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
futures     = "0.3"
url         = "2"
thiserror   = "1"
uuid        = { version = "1", features = ["v4"] }
lazy_static = "1.4"

[profile.release]
lto           = true
opt-level     = "z"
codegen-units = 1
strip         = true
panic         = "abort"
