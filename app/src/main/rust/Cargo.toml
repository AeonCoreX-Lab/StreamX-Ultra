[package]
name        = "streamx_core"
version     = "1.4.0"
edition     = "2021"
authors     = ["AeonCoreX Team"]
publish     = false

# staticlib → .a linked into libstreamx-native.so (same as before)
# JNI functions from Rust become part of the shared library
[lib]
crate-type = ["staticlib"]

[dependencies]
# JNI bridge
jni          = "0.21"
log          = "0.4"
android_logger = "0.13"
anyhow       = "1.0"

# Async runtime (for torrent engine + HTTP)
tokio        = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
once_cell    = "1.18"
parking_lot  = "0.12"

# Torrent engine (pure Rust — replaces C++ libtorrent)
librqbit     = { version = "4", default-features = false,
                 features = ["sha1"] }

# Local HTTP server (serves torrent file with Range support)
hyper        = { version = "1", features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes        = "1"
tokio-util   = { version = "0.7", features = ["io"] }

# HTTP client (for addon transport — replaces OkHttp for Rust side)
reqwest      = { version = "0.12", default-features = false,
                 features = ["json", "rustls-tls"] }

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
futures      = "0.3"
url          = "2"
thiserror    = "1"
uuid         = { version = "1", features = ["v4"] }
lazy_static  = "1.4"

# ── OpenSSL (vendored: compile from source for Android cross-build) ────────
# librqbit v4 transitively pulls native-tls → openssl-sys.
# Vendored feature compiles OpenSSL via NDK toolchain — no system install needed.
openssl      = { version = "0.10", features = ["vendored"] }

[profile.release]
lto           = true
opt-level     = "z"      # size-optimised for .so on Android
codegen-units = 1
strip         = true
panic         = "abort"
