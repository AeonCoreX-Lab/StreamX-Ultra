[package]
name        = "streamx_core"
version     = "1.4.0"
edition     = "2021"
authors     = ["AeonCoreX Team"]
publish     = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# JNI bridge
jni          = "0.21"
log          = "0.4"
android_logger = "0.14"
anyhow       = "1.0"

# Async runtime
tokio        = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
once_cell    = "1.18"
parking_lot  = "0.12"

# Torrent engine - LATEST VERSION
# NOTE: OpenSSL is provided by vcpkg.
librqbit     = { version = "9.0.0-rc.0", default-features = false }

# Explicitly satisfy the SHA-1 crypto backend requirement for rqbit
librqbit-sha1-wrapper = { version = "=9.0.0-rc.0", features = ["sha1-crypto-hash"] }

# Local HTTP server
hyper        = { version = "1", features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes        = "1"
tokio-util   = { version = "0.7", features = ["io"] }

# HTTP client (for addon transport)
reqwest      = { version = "0.12", default-features = false,
                 features = ["json", "rustls-tls"] }

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
futures      = "0.3"
url          = "2"
thiserror    = "1"
uuid         = { version = "1", features = ["v4"] }
lazy_static  = "1.4"

[profile.release]
lto           = true
opt-level     = "z"
codegen-units = 1
strip         = true
panic         = "abort"
