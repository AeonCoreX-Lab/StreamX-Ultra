[package]
name = "streamx_core"
version = "1.3.0"
edition = "2021"
authors = ["AeonCoreX Team"]
publish = false

[lib]
# FIX: 'cdylib' (Shared) এর বদলে 'staticlib' ব্যবহার করতে হবে
# কারণ আমরা C++ এর সাথে এই লাইব্রেরিটি মার্জ করব।
crate-type = ["staticlib"]

[dependencies]
jni = "0.21"
lazy_static = "1.4"
once_cell = "1.18"
log = "0.4"
android_logger = "0.13"
anyhow = "1.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
