            chmod +x gradlew
            TMDB_API_KEY=${TMDB_API_KEY} STARTAPP_APP_ID=${STARTAPP_APP_ID} BACKEND_BASE_URL=${BACKEND_BASE_URL} ./gradlew assembleRelease \
