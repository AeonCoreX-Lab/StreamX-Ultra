            rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
            curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xvzf - -C ~/.cargo/bin
