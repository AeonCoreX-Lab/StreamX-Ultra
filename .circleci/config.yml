version: 2.1

executors:
  android-builder:
    docker:
      - image: cimg/android:2026.03.1
    resource_class: large

jobs:
  debug-build:
    executor: android-builder
    environment:
      CCACHE_DIR: "/home/circleci/.cache/ccache"
      CCACHE_MAXSIZE: "2G"
    steps:
      - run:
          name: Setup Swap Space
          command: |
            (
              if ! swapon --show | grep -q /swapfile; then
                sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
                sudo swapon /swapfile
              fi
            ) || echo "Warning: swap setup not permitted in this environment, continuing without swap"
            free -h
      - checkout
      - run:
          name: Initialize Git Submodules
          command: |
            git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
      - run:
          name: Get mpv-android upstream commit hash
          command: |
            HASH=$(git ls-remote https://github.com/mpv-android/mpv-android.git HEAD 2>/dev/null | awk '{print $1}')
            if [ -z "$HASH" ]; then HASH="unknown"; fi
            echo "$HASH" > .mpv-upstream-hash
            echo "mpv-android HEAD: $HASH"
      - run:
          name: Generate cache keys
          command: |
            if [ -f "app/src/main/rust/Cargo.lock" ]; then
              cat app/src/main/rust/Cargo.lock > .rust-cache-key
              cat app/src/main/rust/Cargo.lock > .ccache-key
            else
              echo "rust-no-lock-$(date +%Y%m%d)" > .rust-cache-key
              echo "ccache-no-lock-$(date +%Y%m%d)" > .ccache-key
            fi
      - restore_cache:
          keys:
            - v1-mpv-src-{{ checksum ".mpv-upstream-hash" }}
      - restore_cache:
          keys:
            - v1-ccache-{{ checksum ".ccache-key" }}
            - v1-ccache-
      - restore_cache:
          keys:
            - v1-rust-registry-{{ checksum ".rust-cache-key" }}
            - v1-rust-registry-
      - run:
          name: Install Rust Toolchain
          no_output_timeout: 10m
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo 'source $HOME/.cargo/env' >> $BASH_ENV
            source $HOME/.cargo/env
            rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
            curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xvzf - -C ~/.cargo/bin
            cargo binstall -y cargo-ndk
      - run:
          name: Install Android NDK & Build Tools
          no_output_timeout: 20m
          command: |
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"
            echo 'export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865' >> $BASH_ENV
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ccache yasm nasm pkg-config meson ninja-build python3-pip python3-setuptools
      - run:
          name: Build MPV, FFmpeg & Extract Headers
          no_output_timeout: 45m
          command: |
            source $HOME/.cargo/env
            export PATH="/usr/lib/ccache:$PATH"
            ccache -s || true
            if [ ! -d "mpv-android" ]; then git clone https://github.com/mpv-android/mpv-android.git; fi
            cd mpv-android/buildscripts
            export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865
            export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
            chmod +x *.sh
            git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "git://git.ffmpeg.org/ffmpeg.git"
            git config --global url."https://".insteadOf git://
            ./download.sh

            for arch in arm64 armv7l x86 x86_64; do
              ./buildall.sh --arch $arch
              if [ "$arch" = "arm64" ]; then ABI="arm64-v8a";
              elif [ "$arch" = "armv7l" ]; then ABI="armeabi-v7a";
              else ABI="$arch"; fi
              TARGET_DIR="../../app/src/main/jniLibs/$ABI"
              mkdir -p "$TARGET_DIR"
              find ~/project -type f -name "libmpv.so" | grep "$arch" | head -n 1 | xargs -I {} cp {} "$TARGET_DIR/" || true
              find ~/project -type f -name "*.so" | grep -E "(libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale)" | grep "$arch" | while read -r libfile; do
                cp "$libfile" "$TARGET_DIR/" || true
              done
            done

            mkdir -p ~/project/app/src/main/cpp/include/mpv
            curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/client.h -o ~/project/app/src/main/cpp/include/mpv/client.h
            curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render.h -o ~/project/app/src/main/cpp/include/mpv/render.h
            curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render_gl.h -o ~/project/app/src/main/cpp/include/mpv/render_gl.h
            curl -L https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/stream_cb.h -o ~/project/app/src/main/cpp/include/mpv/stream_cb.h

            FFMPEG_INCLUDE_BASE=$(find ~/project/mpv-android/buildscripts/prefix -maxdepth 2 -type d -name "include" | head -n 1)
            if [ -z "$FFMPEG_INCLUDE_BASE" ]; then
              FFMPEG_INCLUDE_BASE=$(find ~/project/mpv-android -path "*/include/libavcodec" -type d | head -n 1 | sed 's|/libavcodec||')
            fi
            if [ -n "$FFMPEG_INCLUDE_BASE" ]; then
              for lib in libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
                if [ -d "$FFMPEG_INCLUDE_BASE/$lib" ]; then cp -r "$FFMPEG_INCLUDE_BASE/$lib" ~/project/app/src/main/cpp/include/; fi
              done
            fi
      - save_cache:
          paths:
            - mpv-android
            - .mpv-upstream-hash
          key: v1-mpv-src-{{ checksum ".mpv-upstream-hash" }}
      - save_cache:
          paths:
            - ~/.cache/ccache
          key: v1-ccache-{{ checksum ".ccache-key" }}
      - save_cache:
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/.cargo/bin
            - app/src/main/rust/target
          key: v1-rust-registry-{{ checksum ".rust-cache-key" }}
      - run:
          name: Build Debug APK
          command: |
            source $HOME/.cargo/env
            echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json
            chmod +x gradlew
            TMDB_API_KEY=${TMDB_API_KEY} STARTAPP_APP_ID=${STARTAPP_APP_ID} BACKEND_BASE_URL=${BACKEND_BASE_URL} ./gradlew assembleDebug --stacktrace
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: StreamX-Ultra-Debug-APK
      - run:
          name: Notify GitHub Actions Fallback (on failure)
          when: on_fail
          command: |
            if [[ -n "${GITHUB_PAT}" ]]; then
              REF="${CIRCLE_BRANCH:-$CIRCLE_TAG}"
              curl -X POST \
                -H "Authorization: token ${GITHUB_PAT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/dispatches" \
                -d "{\"event_type\":\"circleci-failed\",\"client_payload\":{\"ref\":\"${REF}\",\"sha\":\"${CIRCLE_SHA1}\"}}" || true
            fi

  release-build:
    executor: android-builder
    environment:
      CCACHE_DIR: "/home/circleci/.cache/ccache"
      CCACHE_MAXSIZE: "2G"
